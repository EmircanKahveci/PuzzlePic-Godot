name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          if [ "$HOME" != "/root" ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          godot --version
          test -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --editor --quit-after 3

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/PuzzlePic-Godot.apk
          test -s build/PuzzlePic-Godot.apk
          ls -lh build/PuzzlePic-Godot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PuzzlePic-Godot-APK
          path: build/PuzzlePic-Godot.apk
          if-no-files-found: error
          retention-days: 14
